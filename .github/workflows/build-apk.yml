{
  "name": "Build Athkari APK",
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Unpack Athkari Android Project",
          "run": "echo \"\" | tr -d \" \\n\\r\" | base64 -d | tar -xJf -"
        },
        {
          "name": "Set up JDK 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "java-version": "17",
            "distribution": "temurin"
          }
        },
        {
          "name": "Setup Android SDK",
          "uses": "android-actions/setup-android@v3"
        },
        {
          "name": "Setup Gradle",
          "uses": "gradle/actions/setup-gradle@v3",
          "with": {
            "gradle-version": "8.5"
          }
        },
        {
          "name": "Build Debug APK",
          "run": "gradle assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk Athkari.apk"
        },
        {
          "name": "Upload APK Artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "Athkari-APK",
            "path": "Athkari.apk"
          }
        },
        {
          "name": "Publish Direct APK to Releases",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "gh release delete v1.0 --yes || true && git tag -f v1.0 && git push -f origin v1.0 && gh release create v1.0 Athkari.apk --title \"تطبيق أذكاري (Athkari.apk)\" --notes \"اضغط على ملف Athkari.apk بالأسفل لتحميله وتثبيته مباشرة على جوالك السامسونج.\""
        }
      ]
    }
  }

}
