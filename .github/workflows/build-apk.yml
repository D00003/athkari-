name: Build Athkari APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Athkari Android Project
        run: |
          if [ -f "athkari_android_project2.zip" ]; then
            unzip -o "athkari_android_project2.zip" -d .
          fi
          if [ -d "athkari_android_project2" ]; then
            cp -r athkari_android_project2/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Athkari.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athkari-APK
          path: Athkari.apk
