name: Build Athkari APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and Locate Project Directory
        run: |
          if [ -f "athkari_android_project2.zip" ]; then
            unzip -o "athkari_android_project2.zip" -d .
          fi
          # البحث عن المجلد الصحيح الذي يحتوي على ملف الإعدادات
          if [ -d "athkari_android_project2" ]; then
            cd athkari_android_project2
          elif [ -f "settings.gradle.kts" ]; then
            echo "Already in root"
          else
            # العثور على أي مجلد فرعي يحتوي على المشروع
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          end
          pwd
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK manually
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          # الدخول للمجلد الصحيح في حال تم تغييره
          if [ -d "athkari_android_project2" ]; then
            cd athkari_android_project2
          fi
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athkari-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
