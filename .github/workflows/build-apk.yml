​- name: Set up JDK 17


uses: actions/setup-java@v4


with:


java-version: '17'


distribution: 'temurin'


​- name: Setup Android SDK


uses: android-actions/setup-android@v3


​- name: Setup Gradle


uses: gradle/actions/setup-gradle@v3


with:


gradle-version: '8.5'


​- name: Build Debug APK


run: |


gradle assembleDebug


cp app/build/outputs/apk/debug/app-debug.apk Athkari.apk


​- name: Upload Athkari APK Artifact


uses: actions/upload-artifact@v4


with:


name: Athkari-APK


path: Athkari.apk


​- name: Publish Direct APK to GitHub Releases


env:


GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


run: |


gh release delete v1.0 --yes || true


git tag -f v1.0


git push -f origin v1.0


gh release create v1.0 Athkari.apk --title "تطبيق أذكاري (Athkari.apk)" --notes "اضغط على ملف Athkari.apk بالأسفل لتحميله وتثبيته مباشرة على جوالك السامسونج."


